  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #080b19; color: #eef1ff; font-family: system-ui, sans-serif; }
    hyperframes-slideshow { display: block; position: relative; width: 100%; height: 100%; }
    hyperframes-player { position: absolute; inset: 0; }
    .controls { position: fixed; top: 18px; right: 20px; z-index: 30; display: flex; gap: 10px; align-items: center; }
    button { border: 1px solid #42506c; background: #0b1124; color: #eef1ff; border-radius: 5px; padding: 11px 15px; font: 13px ui-monospace, monospace; cursor: pointer; }
    button:hover { border-color: #70e9e4; }
    button:focus-visible { outline: 3px solid #ff70b7; outline-offset: 4px; }
    button:disabled { opacity: .5; cursor: default; }
    #play { color: #70e9e4; border-color: #3c888e; }
    #status { font: 12px ui-monospace, monospace; padding: 8px; background: #080b19e6; }
    body[data-install-slide] { background: #000; }
    body[data-install-slide] :is(.controls, [data-hf-chrome]) { display: none !important; }
    body[data-install-slide] hyperframes-player { inset: 0 !important; height: 100% !important; }
    @media (max-width: 600px) { .controls { top: 8px; right: 8px; flex-wrap: wrap; left: 8px; justify-content: flex-end; } #status { font-size: 11px; } }
    @media print { .controls { display: none; } }
  </style>
</head>
<body>
  <hyperframes-slideshow tabindex="0" sound>
    <hyperframes-player interactive src="composition/index.html"></hyperframes-player>
    <script type="application/hyperframes-slideshow+json">

    </script>
    <div class="controls">
      <span id="status" role="status">Loading deck…</span>
      <button id="play" type="button" disabled>▶ Start auto</button>
      <button id="exit" type="button" disabled>Exit</button>
    </div>
  </hyperframes-slideshow>
  <audio id="music" preload="auto" loop></audio>
  <audio id="narration" preload="auto"></audio>
  <script src="deck.js" type="module"></script>
</body>
